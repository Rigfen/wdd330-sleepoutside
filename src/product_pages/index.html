<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Product Details</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider">
    <section class="product-detail">

      <h2 id="p-category">Product</h2>
      <h3 id="p-brand"></h3>
      <h2 id="p-name"></h2>

      <img id="p-image" class="divider" src="" alt="Product image" />

      <p id="p-price" class="product-card__price"></p>
      <p id="p-color" class="product__color"></p>
      <div id="color-options" class="color-options"></div>

      <div id="p-description" class="product__description">
      </div>

      <div class="product-detail__add">
        <button id="add-to-cart">Add to Cart</button>
      </div>

    </section>
  </main>

  <footer id="main-footer"></footer>

  <script src="/js/product.js" type="module"></script>
</body>

</html>
