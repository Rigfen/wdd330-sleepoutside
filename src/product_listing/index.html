<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <header class="divider" id="main-header"></header>

    <main>
        <section class="products">
            <h2 class="title">Top Products</h2>

            <label for="product-sort">Sort By:</label>
            <select id="product-sort" name="product-sort">
                <option value="">Sort</option>
                <option value="NameA-Z">Name (A-Z)</option>
                <option value="NameZ-A">Name (Z-A)</option>
                <option value="PriceASC">Price (Low-High)</option>
                <option value="PriceDESC">Price (High-Low)</option>
            </select>

            <ul class="product-list"></ul>
        </section>
    </main>

    <footer id="main-footer"></footer>

    <script src="../js/product-listing.js" type="module"></script>
</body>

</html>
